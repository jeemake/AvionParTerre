name: Core tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/AvionParTerre.Core.Tests/AvionParTerre.Core.Tests.csproj --configuration Release --logger 'trx;LogFileName=core-tests.trx'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: tests/AvionParTerre.Core.Tests/TestResults/*.trx
